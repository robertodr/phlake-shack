[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-uki"
version = "0.1.0"
description = "Target-local signed UKI installer primitives"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
secure-uki = "secure_uki.cli:main"
secure-uki-fwupd = "secure_uki.fwupd:main"

[tool.setuptools.packages.find]
where = ["src"]
