name: Update kenn-forge

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: update-kenn-forge
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/kenn-io/forge/commits/HEAD)
          REV=$(echo "$LATEST" | jq -r '.sha')
          DATE=$(echo "$LATEST" | jq -r '.commit.committer.date' | cut -dT -f1)
          CURRENT_REV=$(grep -oP 'rev = "\K[^"]+' pkgs/kenn-forge/default.nix)

          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          if [[ "$REV" == "$CURRENT_REV" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prefetch source
        if: steps.check.outputs.skip == 'false'
        id: src
        run: |
          set -euo pipefail
          REV="${{ steps.check.outputs.rev }}"
          HASH=$(nix-prefetch-url --type sha256 --unpack \
            "https://github.com/kenn-io/forge/archive/${REV}.tar.gz" 2>/dev/null)
          SRI=$(nix hash to-sri --type sha256 "$HASH")
          echo "hash=$SRI" >> "$GITHUB_OUTPUT"

      - name: Regenerate bun.nix
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          REV="${{ steps.check.outputs.rev }}"
          WORKDIR=$(mktemp -d)
          curl -fsSL "https://github.com/kenn-io/forge/archive/${REV}.tar.gz" \
            | tar xz -C "$WORKDIR" --strip-components=1

          # bun2nix interprets 4-element package tuples as npm packages. Bun can
          # record an aliased GitHub dependency using the repository name rather
          # than the declared package name, which makes bun2nix's npm URL parser
          # mistake the repository slash for an npm scope separator. Normalize
          # those identifiers before generation; the next step replaces the
          # resulting placeholder npm fetch with the real GitHub tarball.
          python3 - "$WORKDIR/bun.lock" <<'PY'
          import json, re, sys

          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          lock = json.loads(re.sub(r',(\s*[}\]])', r'\1', content))

          github_packages = {}
          for workspace in lock.get('workspaces', {}).values():
              for section in ('dependencies', 'devDependencies'):
                  for package, version in workspace.get(section, {}).items():
                      if isinstance(version, str) and version.startswith('github:'):
                          repo = version[len('github:'):].split('#', 1)[0]
                          github_packages[repo] = package

          for package_data in lock.get('packages', {}).values():
              if not isinstance(package_data, list) or len(package_data) != 4:
                  continue
              identifier = package_data[0]
              if not isinstance(identifier, str):
                  continue
              marker_at = identifier.find('@github:', 1 if identifier.startswith('@') else 0)
              if marker_at < 0:
                  continue
              repo = identifier[marker_at + len('@github:'):].split('#', 1)[0]
              declared_package = github_packages.get(repo)
              if declared_package and identifier[:marker_at] != declared_package:
                  normalized = declared_package + identifier[marker_at:]
                  print(f'Normalized GitHub package identifier: {identifier} -> {normalized}')
                  package_data[0] = normalized

          with open(path, 'w') as f:
              json.dump(lock, f, indent=2)
              f.write('\n')
          PY

          # Use the locked bun2nix rev for consistency with the Nix build steps
          BUN2NIX_REV=$(python3 -c "import json; d=json.load(open('flake.lock')); print(d['nodes']['bun2nix']['locked']['rev'])")
          REPO_DIR="$PWD"
          pushd "$WORKDIR"
          nix run \
            --extra-substituters "https://nix-community.cachix.org" \
            --extra-trusted-public-keys "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=" \
            "github:nix-community/bun2nix/${BUN2NIX_REV}" -- \
            -o "$REPO_DIR/pkgs/kenn-forge/bun.nix"
          popd

          # Persist paths for the next step
          echo "FORGE_WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "FORGE_REV=$REV" >> "$GITHUB_ENV"

      - name: Fix GitHub dependency URLs in bun.nix
        if: steps.check.outputs.skip == 'false'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, subprocess, sys

          bun_lock_path = os.path.join(os.environ['FORGE_WORKDIR'], 'bun.lock')
          bun_nix_path = os.path.join(
              os.environ['GITHUB_WORKSPACE'],
              'pkgs', 'kenn-forge', 'bun.nix',
          )

          def load_jsonc(path):
              with open(path) as f:
                  content = f.read()
              # Strip JSONC trailing commas before } or ]
              return json.loads(re.sub(r',(\s*[}\]])', r'\1', content))

          lock = load_jsonc(bun_lock_path)

          # Collect GitHub refs from workspace dependency declarations. bun.lock
          # usually stores a full SHA here, but may retain a tag while using a
          # short resolved SHA in the packages section.
          github_declared_refs = {}  # "owner/repo" -> "sha_or_tag"
          for workspace in lock.get('workspaces', {}).values():
              for deps in [workspace.get('dependencies', {}),
                           workspace.get('devDependencies', {})]:
                  for _pkg, ver in deps.items():
                      if isinstance(ver, str) and ver.startswith('github:'):
                          spec = ver[len('github:'):]
                          if '#' in spec:
                              repo_path, declared_ref = spec.split('#', 1)
                              github_declared_refs[repo_path] = declared_ref

          # Find GitHub-spec entries in the packages section that use 4-element
          # format.  bun2nix treats these as npm packages and generates incorrect
          # registry URLs instead of codeload.github.com tarball URLs.
          packages = lock.get('packages', {})
          fixes = {}  # broken_url -> correct_url

          def compute_broken_npm_url(identifier):
              """Reconstruct the broken npm URL bun2nix generates for this identifier."""
              registry = 'https://registry.npmjs.org/'
              slash = identifier.find('/')
              if slash < 0:
                  at = identifier.find('@')
                  if at < 0:
                      return None
                  name, ver = identifier[:at], identifier[at + 1:]
                  return f'{registry}{name}/-/{name}-{ver}.tgz'
              user = identifier[:slash]
              name_ver = identifier[slash + 1:]
              at = name_ver.find('@')
              if at < 0:
                  return None
              name, ver = name_ver[:at], name_ver[at + 1:]
              return f'{registry}{user}/{name}/-/{name}-{ver}.tgz'

          for _pkg_key, pkg_data in packages.items():
              if not isinstance(pkg_data, list) or len(pkg_data) != 4:
                  continue
              identifier = pkg_data[0]

              # Locate the @ separator between package name and version specifier,
              # skipping the leading @ for scoped packages.
              start = 1 if identifier.startswith('@') else 0
              at = identifier.find('@', start)
              if at < 0:
                  continue
              specifier = identifier[at + 1:]
              if not specifier.startswith('github:'):
                  continue

              github_spec = specifier[len('github:'):]  # "owner/repo#short_rev"
              if '#' not in github_spec:
                  continue
              repo_path, short_rev = github_spec.split('#', 1)

              declared_ref = github_declared_refs.get(repo_path)
              if not declared_ref:
                  print(f'WARNING: no declared ref found for {repo_path}', file=sys.stderr)
                  continue

              if declared_ref.startswith(short_rev):
                  full_sha = declared_ref
              else:
                  # The tuple may identify an annotated tag object rather than
                  # its target commit. Try the declared tag first, then a commit
                  # lookup, and validate the result against Bun's short SHA.
                  lookups = [
                      (f'repos/{repo_path}/git/ref/tags/{declared_ref}', '.object.sha'),
                      (f'repos/{repo_path}/commits/{declared_ref}', '.sha'),
                  ]
                  full_sha = None
                  errors = []
                  for endpoint, query in lookups:
                      result = subprocess.run(
                          ['gh', 'api', endpoint, '--jq', query],
                          capture_output=True, text=True,
                      )
                      resolved = result.stdout.strip()
                      if result.returncode == 0 and resolved.startswith(short_rev):
                          full_sha = resolved
                          break
                      if result.stderr.strip():
                          errors.append(result.stderr.strip())
                  if not full_sha:
                      print(
                          f'WARNING: could not resolve {repo_path}#{short_rev}: '
                          + '; '.join(errors),
                          file=sys.stderr,
                      )
                      continue

              broken_url = compute_broken_npm_url(identifier)
              if not broken_url:
                  continue
              correct_url = f'https://codeload.github.com/{repo_path}/tar.gz/{full_sha}'
              # extract-bun-package (bun2nix's runtime helper) only unpacks
              # fetched files whose store-path name ends in `.tgz`; a codeload
              # tarball URL's basename is just the commit SHA, so give the
              # fetchurl entry an explicit `name` ending in `.tgz`, or it falls
              # through to a plain `cp -r` that fails on a non-directory.
              repo_name = repo_path.rsplit('/', 1)[-1]
              tgz_name = f'{repo_name}-{full_sha}.tgz'
              fixes[broken_url] = (correct_url, tgz_name)
              print(f'Queued fix for {identifier}')

          if not fixes:
              print('No GitHub dependency fixes needed in bun.nix')
              sys.exit(0)

          with open(bun_nix_path) as f:
              content = f.read()

          for broken, (correct, tgz_name) in fixes.items():
              if broken not in content:
                  print(f'WARNING: URL not found in bun.nix: {broken}', file=sys.stderr)
                  continue

              # bun2nix also mismatches the hash for github: specs, since it
              # hashes whatever it thinks the (bogus) npm tarball is. Recompute
              # the hash for the real codeload.github.com tarball, and insert a
              # `name` attribute so the fetched store path ends in `.tgz` (see
              # above). Replace the url line and the immediately-following
              # hash line: entries are uniformly
              #   "<name>@<ver>" = fetchurl { url = "..."; hash = "sha512-..."; };
              result = subprocess.run(
                  ['nix', 'store', 'prefetch-file', '--json', '--hash-type', 'sha512', correct],
                  capture_output=True, text=True, check=True,
              )
              new_hash = json.loads(result.stdout)['hash']

              pattern = re.compile(
                  r'url = "' + re.escape(broken) + r'";(\s*\n\s*)hash = "sha512-[^"]*";'
              )
              replacement = (
                  f'url = "{correct}";'
                  r'\g<1>' + f'name = "{tgz_name}";'
                  r'\g<1>' + f'hash = "{new_hash}";'
              )
              new_content, n = pattern.subn(replacement, content)
              if n == 0:
                  print(f'WARNING: could not locate hash line following {broken}', file=sys.stderr)
                  continue
              content = new_content
              print(f'Fixed: {broken[:70]}... -> {correct[:70]}...')

          with open(bun_nix_path, 'w') as f:
              f.write(content)
          print('bun.nix GitHub dependency fix complete')

      - name: Update derivation
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          DATE="${{ steps.check.outputs.date }}"
          REV="${{ steps.check.outputs.rev }}"
          SRC_HASH="${{ steps.src.outputs.hash }}"
          FAKE_HASH="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

          cd pkgs/kenn-forge
          sed -i "s|version = \"unstable-[0-9-]*\"|version = \"unstable-${DATE}\"|" default.nix
          sed -i "s|rev = \"[a-f0-9]*\"|rev = \"${REV}\"|" default.nix
          sed -i "s|hash = \"sha256-[^\"]*\"|hash = \"${SRC_HASH}\"|" default.nix
          sed -i "s|vendorHash = \"sha256-[^\"]*\"|vendorHash = \"${FAKE_HASH}\"|" default.nix

      - name: Determine vendorHash
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          BUILD_EXPR="
            let
              self = builtins.getFlake \"path:$PWD\";
              pkgs = import self.inputs.nixpkgs { system = \"x86_64-linux\"; };
              bun2nix = self.inputs.bun2nix.packages.x86_64-linux.default;
            in (pkgs.callPackage $PWD/pkgs/kenn-forge { inherit bun2nix; }).goModules
          "

          if OUTPUT=$(nix build --no-link --impure --expr "$BUILD_EXPR" 2>&1); then
            echo "::error::Build unexpectedly succeeded with fake vendorHash"
            exit 1
          fi

          VENDOR_HASH=$(echo "$OUTPUT" | grep -oP 'got:\s+\Ksha256-\S+' | head -1)
          if [[ -z "$VENDOR_HASH" ]]; then
            echo "::error::Failed to determine vendorHash from build output"
            echo "$OUTPUT"
            exit 1
          fi

          sed -i "s|vendorHash = \"sha256-[^\"]*\"|vendorHash = \"${VENDOR_HASH}\"|" \
            pkgs/kenn-forge/default.nix

      - name: Verify build
        id: verify
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          BUILD_EXPR="
            let
              self = builtins.getFlake \"path:$PWD\";
              pkgs = import self.inputs.nixpkgs { system = \"x86_64-linux\"; };
              bun2nix = self.inputs.bun2nix.packages.x86_64-linux.default;
            in pkgs.callPackage $PWD/pkgs/kenn-forge { inherit bun2nix; }
          "
          nix build --no-link --impure --expr "$BUILD_EXPR"

      - name: Warn on failed build
        if: steps.check.outputs.skip == 'false' && steps.verify.outcome != 'success'
        run: |
          echo "::warning::kenn-forge build failed for rev ${{ steps.check.outputs.rev }}; skipping PR creation. See the 'Verify build' step log for details."

      - name: Create Pull Request
        if: steps.check.outputs.skip == 'false' && steps.verify.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): update kenn-forge to unstable-${{ steps.check.outputs.date }}"
          title: "chore(deps): update kenn-forge to unstable-${{ steps.check.outputs.date }}"
          body: |
            Automated update of kenn-forge to [`${{ steps.check.outputs.rev }}`](https://github.com/kenn-io/forge/commit/${{ steps.check.outputs.rev }}).
          branch: chore-deps-update-kenn-forge
          delete-branch: true
